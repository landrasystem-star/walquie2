<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Walkie Talkie - Con JSON</title>
    <style>
        *{user-select:none;-webkit-tap-highlight-color:transparent}
        body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0a0a0f,#1a1a2e);font-family:'Segoe UI',sans-serif;display:flex;justify-content:center;align-items:center;padding:20px}
        .container{max-width:500px;width:100%}
        .walkie{background:#2c2c3e;border-radius:40px;padding:25px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
        h1{text-align:center;color:#ff6b6b;margin:0;font-size:1.6rem}
        .subtitle{text-align:center;color:#2ed573;font-size:.7rem;margin-bottom:20px}
        
        .ids-panel{background:#0a0a0f;border-radius:15px;padding:12px;margin-bottom:20px}
        .id-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:.7rem}
        .id-label{color:#888}
        .id-value{color:#2ed573;font-family:monospace;word-break:break-all;max-width:200px;text-align:right}
        
        .walkies{display:flex;gap:15px;margin-bottom:20px}
        .walkie-card{flex:1;text-align:center;padding:15px;background:#1e1e2a;border-radius:20px;cursor:pointer;border:2px solid transparent}
        .walkie-card.selected{border-color:#2ed573;background:#2ed57322}
        .walkie-num{font-size:2rem;font-weight:bold}
        .walkie-status{font-size:.7rem;margin-top:5px}
        .walkie-id-peque{font-size:.6rem;color:#2ed573;margin-top:5px;word-break:break-all}
        
        .botonera{display:flex;gap:10px;margin-bottom:10px}
        .botonera button{flex:1;padding:12px;border:none;border-radius:12px;color:white;font-weight:bold;cursor:pointer}
        .reset{background:#ffa502}
        .actualizar{background:#3498db}
        .modo{background:#2ed573}
        .json{background:#6c5ce7}
        
        .ptt-btn{width:180px;height:180px;border-radius:50%;background:radial-gradient(#e74c3c,#c0392b);border:4px solid #ecf0f1;cursor:pointer;margin:20px auto;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:1.2rem;font-weight:bold;color:white}
        .ptt-btn:active{transform:scale(.96)}
        .ptt-btn.disabled{opacity:0.5;pointer-events:none}
        
        .estado{text-align:center;margin-top:10px;padding:8px;border-radius:10px;font-size:.8rem}
        .verde{background:#2ed57322;color:#2ed573}
        .rojo{background:#ff475722;color:#ff4757}
        .info{font-size:.7rem;color:#888;text-align:center;margin-top:15px}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#2ed573;color:#0a0a0f;padding:10px 20px;border-radius:30px;font-size:.8rem;z-index:1000}
    </style>
</head>
<body>
<div class="container">
    <div class="walkie">
        <h1>📞 WALKIE</h1>
        <div class="subtitle">Peer to Peer - IDs en JSON</div>

        <div class="ids-panel">
            <div class="id-row">
                <span class="id-label">📻 Walkie 1 ID:</span>
                <span class="id-value" id="mostrarId1">---</span>
            </div>
            <div class="id-row">
                <span class="id-label">📻 Walkie 2 ID:</span>
                <span class="id-value" id="mostrarId2">---</span>
            </div>
        </div>

        <div class="walkies">
            <div class="walkie-card" id="card1">
                <div class="walkie-num">📻 1</div>
                <div class="walkie-status" id="status1">Libre</div>
                <div class="walkie-id-peque" id="id1peque">---</div>
            </div>
            <div class="walkie-card" id="card2">
                <div class="walkie-num">📻 2</div>
                <div class="walkie-status" id="status2">Libre</div>
                <div class="walkie-id-peque" id="id2peque">---</div>
            </div>
        </div>

        <div class="botonera">
            <button id="resetBtn" class="reset">🔄 RESET</button>
            <button id="actualizarBtn" class="actualizar">🔄 ACTUALIZAR</button>
            <button id="modoBtn" class="modo">📻 PTT</button>
            <button id="jsonBtn" class="json">💾 JSON</button>
        </div>

        <div id="ptt" class="ptt-btn disabled">🎧<br>ESPERANDO</div>
        <div id="estado" class="estado rojo">⚡ Sin conectar</div>
        <div class="info">Elige un walkie. Guarda los IDs en JSON y compártelo.</div>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// ============ IDs desde localStorage ============
let idWalkie1 = localStorage.getItem('walkie1_id');
let idWalkie2 = localStorage.getItem('walkie2_id');

// Si no existen, se crean automáticamente
if (!idWalkie1) {
    idWalkie1 = 'w1_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
    localStorage.setItem('walkie1_id', idWalkie1);
}
if (!idWalkie2) {
    idWalkie2 = 'w2_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
    localStorage.setItem('walkie2_id', idWalkie2);
}

// Función para actualizar la interfaz con los IDs actuales
function actualizarInterfazIDs() {
    document.getElementById('mostrarId1').innerText = idWalkie1;
    document.getElementById('mostrarId2').innerText = idWalkie2;
    document.getElementById('id1peque').innerText = idWalkie1.substring(0, 12) + '...';
    document.getElementById('id2peque').innerText = idWalkie2.substring(0, 12) + '...';
}

actualizarInterfazIDs();

// ============ GUARDAR EN JSON ============
function guardarJSON() {
    const datos = {
        walkie1_id: idWalkie1,
        walkie2_id: idWalkie2,
        fecha: new Date().toISOString(),
        version: "1.0"
    };
    
    const jsonStr = JSON.stringify(datos, null, 2);
    const blob = new Blob([jsonStr], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `walkie_ids_${Date.now()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    mostrarToast('✅ JSON guardado');
}

// ============ CARGAR DESDE JSON ============
function cargarJSON() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
            try {
                const datos = JSON.parse(event.target.result);
                if (datos.walkie1_id && datos.walkie2_id) {
                    idWalkie1 = datos.walkie1_id;
                    idWalkie2 = datos.walkie2_id;
                    localStorage.setItem('walkie1_id', idWalkie1);
                    localStorage.setItem('walkie2_id', idWalkie2);
                    actualizarInterfazIDs();
                    mostrarToast('✅ IDs cargados desde JSON');
                    setTimeout(() => location.reload(), 1000);
                } else {
                    mostrarToast('❌ JSON inválido');
                }
            } catch(err) {
                mostrarToast('❌ Error al leer JSON');
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

// ============ RESET TOTAL ============
document.getElementById('resetBtn').onclick = () => {
    idWalkie1 = 'w1_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
    idWalkie2 = 'w2_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
    localStorage.setItem('walkie1_id', idWalkie1);
    localStorage.setItem('walkie2_id', idWalkie2);
    actualizarInterfazIDs();
    mostrarToast('✅ IDs nuevos generados');
};

// ============ ACTUALIZAR PÁGINA ============
document.getElementById('actualizarBtn').onclick = () => {
    location.reload();
};

// ============ MENÚ JSON ============
document.getElementById('jsonBtn').onclick = () => {
    // Crear un menú flotante
    const menu = document.createElement('div');
    menu.style.position = 'fixed';
    menu.style.bottom = '100px';
    menu.style.left = '50%';
    menu.style.transform = 'translateX(-50%)';
    menu.style.background = '#2c2c3e';
    menu.style.borderRadius = '20px';
    menu.style.padding = '15px';
    menu.style.zIndex = '2000';
    menu.style.boxShadow = '0 10px 30px rgba(0,0,0,0.5)';
    menu.style.display = 'flex';
    menu.style.gap = '10px';
    
    const btnGuardar = document.createElement('button');
    btnGuardar.textContent = '💾 GUARDAR JSON';
    btnGuardar.style.padding = '12px 20px';
    btnGuardar.style.background = '#6c5ce7';
    btnGuardar.style.border = 'none';
    btnGuardar.style.borderRadius = '10px';
    btnGuardar.style.color = 'white';
    btnGuardar.style.cursor = 'pointer';
    btnGuardar.onclick = () => {
        guardarJSON();
        document.body.removeChild(menu);
    };
    
    const btnCargar = document.createElement('button');
    btnCargar.textContent = '📂 CARGAR JSON';
    btnCargar.style.padding = '12px 20px';
    btnCargar.style.background = '#00b894';
    btnCargar.style.border = 'none';
    btnCargar.style.borderRadius = '10px';
    btnCargar.style.color = 'white';
    btnCargar.style.cursor = 'pointer';
    btnCargar.onclick = () => {
        cargarJSON();
        document.body.removeChild(menu);
    };
    
    const btnCancelar = document.createElement('button');
    btnCancelar.textContent = '❌';
    btnCancelar.style.padding = '12px 15px';
    btnCancelar.style.background = '#ff4757';
    btnCancelar.style.border = 'none';
    btnCancelar.style.borderRadius = '10px';
    btnCancelar.style.color = 'white';
    btnCancelar.style.cursor = 'pointer';
    btnCancelar.onclick = () => {
        document.body.removeChild(menu);
    };
    
    menu.appendChild(btnGuardar);
    menu.appendChild(btnCargar);
    menu.appendChild(btnCancelar);
    document.body.appendChild(menu);
    
    // Auto cerrar después de 5 segundos
    setTimeout(() => {
        if (document.body.contains(menu)) {
            document.body.removeChild(menu);
        }
    }, 5000);
};

function mostrarToast(mensaje) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = mensaje;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
}

// ============ VARIABLES ============
let peer = null;
let miId = null;
let miWalkie = null;
let stream = null;
let llamada = null;
let audio = null;
let conexionDatos = null;
let otroId = null;
let hablando = false;
let modoPtt = true;

// ============ PEERJS ============
function iniciarPeer(idFijo) {
    if (peer) peer.destroy();
    
    peer = new Peer(idFijo, { host: '0.peerjs.com', port: 443, secure: true });
    
    peer.on('open', (id) => {
        miId = id;
        document.getElementById('estado').innerHTML = `✅ Walkie ${miWalkie === 1 ? '1' : '2'} listo`;
        document.getElementById('estado').className = 'estado verde';
        document.getElementById('ptt').classList.remove('disabled');
    });
    
    peer.on('call', (call) => {
        if (stream) call.answer(stream);
        call.on('stream', (s) => {
            if (audio) audio.pause();
            audio = new Audio();
            audio.srcObject = s;
            audio.autoplay = true;
        });
    });
    
    peer.on('connection', (conn) => {
        conexionDatos = conn;
        conn.on('data', (data) => {
            if (data.tipo === 'ocupado') {
                document.getElementById(`status${data.walkie}`).innerHTML = '👤 Ocupado';
            }
        });
    });
    
    peer.on('error', (err) => {
        console.log('Error:', err);
        if (err.type === 'unavailable-id') {
            document.getElementById('estado').innerHTML = '⚠️ ID en uso. Usa RESET';
            document.getElementById('estado').className = 'estado rojo';
        }
    });
}

// ============ SELECCIONAR WALKIE ============
function seleccionarWalkie(num) {
    if (miWalkie === num) return;
    
    miWalkie = num;
    const idFijo = num === 1 ? idWalkie1 : idWalkie2;
    
    // Marcar visualmente
    document.getElementById('card1').classList.remove('selected');
    document.getElementById('card2').classList.remove('selected');
    document.getElementById(`card${num}`).classList.add('selected');
    
    // Obtener el ID del otro walkie
    const otroNum = num === 1 ? 2 : 1;
    otroId = otroNum === 1 ? idWalkie1 : idWalkie2;
    
    // Conectar al otro peer
    const conn = peer.connect(otroId);
    conexionDatos = conn;
    conn.on('open', () => {
        conn.send({ tipo: 'ocupado', walkie: num });
        document.getElementById('estado').innerHTML = `✅ Conectado al Walkie ${otroNum}`;
    });
    
    conn.on('error', () => {
        document.getElementById('estado').innerHTML = `⚠️ Esperando al Walkie ${otroNum}...`;
    });
    
    iniciarPeer(idFijo);
}

document.getElementById('card1').onclick = () => seleccionarWalkie(1);
document.getElementById('card2').onclick = () => seleccionarWalkie(2);

// ============ MODO PTT / MANOS LIBRES ============
document.getElementById('modoBtn').onclick = () => {
    modoPtt = !modoPtt;
    const btn = document.getElementById('modoBtn');
    if (modoPtt) {
        btn.innerHTML = '📻 PTT';
        if (stream) stream.getAudioTracks().forEach(t => t.enabled = false);
        hablando = false;
        ptt.style.background = 'radial-gradient(#34495e,#2c3e50)';
        ptt.innerHTML = '🎧<br>ESCUCHANDO';
    } else {
        btn.innerHTML = '🎤 LIBRE';
        if (stream && otroId) {
            stream.getAudioTracks().forEach(t => t.enabled = true);
            if (llamada) llamada.close();
            llamada = peer.call(otroId, stream);
            hablando = true;
            ptt.style.background = 'radial-gradient(#ff4757,#c0392b)';
            ptt.innerHTML = '🎤<br>HABLANDO';
        }
    }
};

// ============ PTT ============
const ptt = document.getElementById('ptt');

ptt.onmousedown = async () => {
    if (!modoPtt) return;
    if (!stream) {
        try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        } catch(e) {
            alert('Permite el micrófono');
            return;
        }
    }
    if (!otroId) return;
    
    stream.getAudioTracks().forEach(t => t.enabled = true);
    hablando = true;
    ptt.style.background = 'radial-gradient(#ff4757,#c0392b)';
    ptt.innerHTML = '🎤<br>HABLANDO';
    
    if (llamada) llamada.close();
    llamada = peer.call(otroId, stream);
};

ptt.onmouseup = () => {
    if (!modoPtt) return;
    if (!hablando) return;
    
    if (stream) stream.getAudioTracks().forEach(t => t.enabled = false);
    hablando = false;
    ptt.style.background = 'radial-gradient(#34495e,#2c3e50)';
    ptt.innerHTML = '🎧<br>ESCUCHANDO';
    
    if (llamada) {
        llamada.close();
        llamada = null;
    }
};

ptt.ontouchstart = (e) => { e.preventDefault(); ptt.onmousedown(); };
ptt.ontouchend = (e) => { e.preventDefault(); ptt.onmouseup(); };

// ============ MICRÓFONO ============
navigator.mediaDevices.getUserMedia({ audio: true })
    .then(s => {
        stream = s;
        stream.getAudioTracks().forEach(t => t.enabled = false);
    })
    .catch(() => {});

window.onbeforeunload = () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (peer) peer.destroy();
};
</script>
</body>
</html>
