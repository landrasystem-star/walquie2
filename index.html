<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Walkie Talkie - Sin Token</title>
    <style>
        *{user-select:none;-webkit-tap-highlight-color:transparent}
        body{margin:0;min-height:100vh;background:linear-gradient(135deg,#0a0a0f,#1a1a2e);font-family:'Segoe UI',sans-serif;display:flex;justify-content:center;align-items:center;padding:20px}
        .container{max-width:500px;width:100%}
        .walkie{background:#2c2c3e;border-radius:40px;padding:25px;box-shadow:0 20px 40px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1)}
        h1{text-align:center;color:#ff6b6b;margin:0 0 5px;font-size:1.6rem}
        .subtitle{text-align:center;color:#2ed573;font-size:.7rem;margin-bottom:20px}
        .panel{background:#1e1e2a;border-radius:20px;padding:15px;margin-bottom:20px}
        .id-box{background:#0a0a0f;padding:12px;border-radius:12px;font-family:monospace;text-align:center;margin-bottom:15px;word-break:break-all;color:#2ed573}
        input{width:100%;padding:12px;background:#0a0a0f;border:1px solid #3a3a4a;border-radius:12px;color:white;font-size:1rem;box-sizing:border-box;text-align:center}
        button{width:100%;margin-top:10px;padding:12px;background:#ff6b6b;border:none;border-radius:12px;color:white;font-weight:bold;cursor:pointer}
        .ptt-button{width:180px;height:180px;border-radius:50%;background:radial-gradient(#e74c3c,#c0392b);border:4px solid #ecf0f1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:1.2rem;font-weight:bold;color:white;margin:20px auto;transition:.05s linear}
        .ptt-button:active{transform:scale(.96)}
        .ptt-button.listening{background:radial-gradient(#34495e,#2c3e50)}
        .status{background:#000000aa;border-radius:15px;padding:15px;text-align:center;margin-top:15px}
        .status-value{font-size:1.2rem;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:10px}
        .status-value.listening{color:#2ed573}
        .status-value.speaking{color:#ff4757}
        .led{width:12px;height:12px;border-radius:50%;animation:pulse 1s infinite}
        .led.listening{background:#2ed573}
        .led.speaking{background:#ff4757}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
        .info-text{font-size:.7rem;color:#888;text-align:center;margin-top:15px}
        .botonera{display:flex;gap:10px;margin-top:10px}
        .botonera button{flex:1;margin-top:0}
    </style>
</head>
<body>
<div class="container">
    <div class="walkie">
        <h1>📞 WALKIE TALKIE</h1>
        <div class="subtitle">Sin token - IDs manuales</div>

        <div class="panel">
            <div class="id-box" id="miId">🔄 Conectando...</div>
            <input type="text" id="idAmigo" placeholder="ID de la otra persona">
            <div class="botonera">
                <button id="conectarBtn">🔗 CONECTAR</button>
                <button id="recargarBtn" style="background:#3a3a4a">📡 RECARGAR</button>
            </div>
        </div>

        <div id="pttBtn" class="ptt-button listening">🎧<br>ESCUCHANDO</div>

        <div class="status">
            <div class="status-value listening" id="estadoVal">
                <span class="led listening"></span>DESCONECTADO
            </div>
            <div id="infoConexion" style="font-size:.7rem;margin-top:5px;color:#aaa"></div>
        </div>
        <div class="info-text">
            📌 1. Tu ID aparece arriba. Compártelo con la otra persona<br>
            📌 2. Escribe el ID de la otra persona y pulsa CONECTAR<br>
            📌 3. Mantén el botón rojo para HABLAR<br>
            📌 4. Si no funciona, pulsa RECARGAR o vuelve a CONECTAR
        </div>
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
let peer, miId, stream, callActiva, audioElemento, hablando = false;

// ============ ELEMENTOS DOM ============
const miIdDiv = document.getElementById('miId');
const idAmigoInput = document.getElementById('idAmigo');
const conectarBtn = document.getElementById('conectarBtn');
const recargarBtn = document.getElementById('recargarBtn');
const pttBtn = document.getElementById('pttBtn');
const estadoVal = document.getElementById('estadoVal');
const infoConexion = document.getElementById('infoConexion');

// ============ INICIAR PEER ============
peer = new Peer({ host: '0.peerjs.com', port: 443, secure: true });

peer.on('open', (id) => {
    miId = id;
    miIdDiv.innerHTML = '📱 TU ID: ' + id;
    infoConexion.innerText = 'Comparte este ID con la otra persona';
});

peer.on('call', (call) => {
    if (stream) {
        call.answer(stream);
        conectarLlamada(call);
    }
});

// ============ MICRÓFONO ============
navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true } })
    .then(s => { stream = s; stream.getTracks().forEach(t => t.enabled = false); })
    .catch(e => alert('Permite el micrófono'));

// ============ CONECTAR LLAMADA ============
function conectarLlamada(call) {
    if (callActiva) callActiva.close();
    callActiva = call;
    
    call.on('stream', (s) => {
        if (audioElemento) audioElemento.pause();
        audioElemento = new Audio();
        audioElemento.srcObject = s;
        audioElemento.autoplay = true;
        estadoVal.innerHTML = '<span class="led listening"></span>CONECTADO';
        infoConexion.innerText = '✅ Conectado. Mantén el botón para hablar';
    });
    
    call.on('close', () => {
        callActiva = null;
        estadoVal.innerHTML = '<span class="led listening"></span>DESCONECTADO';
        infoConexion.innerText = '❌ Conexión perdida. Vuelve a conectar';
    });
}

// ============ CONECTAR ============
function conectar() {
    const id = idAmigoInput.value.trim();
    if (!id) {
        alert('Escribe el ID de la otra persona');
        return;
    }
    if (!stream) {
        alert('Esperando micrófono...');
        return;
    }
    
    infoConexion.innerText = 'Conectando...';
    const call = peer.call(id, stream);
    conectarLlamada(call);
}

// ============ PTT ============
function iniciarHablar() {
    if (!callActiva) {
        alert('Primero conéctate a alguien');
        return;
    }
    if (!stream) return;
    
    hablando = true;
    stream.getTracks().forEach(t => t.enabled = true);
    pttBtn.classList.remove('listening');
    pttBtn.innerHTML = '🎤<br>HABLANDO';
    estadoVal.innerHTML = '<span class="led speaking"></span>HABLANDO';
}

function detenerHablar() {
    if (!hablando) return;
    hablando = false;
    if (stream) stream.getTracks().forEach(t => t.enabled = false);
    pttBtn.classList.add('listening');
    pttBtn.innerHTML = '🎧<br>ESCUCHANDO';
    if (callActiva) {
        estadoVal.innerHTML = '<span class="led listening"></span>CONECTADO';
    } else {
        estadoVal.innerHTML = '<span class="led listening"></span>DESCONECTADO';
    }
}

// ============ EVENTOS ============
conectarBtn.onclick = conectar;
recargarBtn.onclick = () => {
    if (callActiva) callActiva.close();
    conectar();
};

pttBtn.onmousedown = iniciarHablar;
pttBtn.onmouseup = detenerHablar;
pttBtn.onmouseleave = detenerHablar;
pttBtn.ontouchstart = (e) => { e.preventDefault(); iniciarHablar(); };
pttBtn.ontouchend = (e) => { e.preventDefault(); detenerHablar(); };

// ============ LIMPIEZA ============
window.onbeforeunload = () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (peer) peer.destroy();
};
</script>
</body>
</html>
